<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ObraPrime — Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#01152E; --navy-2:#0A2442; --navy-3:#163556;
  --gold:#F5B03B; --gold-l:#F6C542; --gold-d:#E49B2C;
  --bg:#E9EDF2; --card:#FFFFFF; --soft:#F3F4F6; --line:#D5DBE3;
  --ink:#0E1A2B; --ink-2:#3F4B5C; --muted:#5B6576;
  --ok:#1D8A5B; --ok-bg:#E5F4EC; --ok-line:#A9D8BF;
  --warn:#7A4A00; --warn-bg:#FFF2D2; --warn-line:#E49B2C;
  --bad:#C62828; --bad-bg:#FDECEC; --bad-line:#F0B4B4;
  --idle:#5B6576; --idle-bg:#EEF0F3; --idle-line:#CBD2DB;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono","Consolas",monospace;
  --side:248px; --bottom:68px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit}

/* ---------- estrutura ---------- */
.app{min-height:100vh}
.side{display:none}
.main{padding-bottom:calc(var(--bottom) + 16px + env(safe-area-inset-bottom))}
.bottom{position:fixed;left:0;right:0;bottom:0;height:calc(var(--bottom) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:30}
.bottom button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:48px;color:var(--muted);position:relative}
.bottom button svg{width:24px;height:24px}
.bottom button span{font:600 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.bottom button.on{color:var(--navy)}
.bottom button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:4px;background:var(--gold);border-radius:0 0 3px 3px}

@media (min-width:900px){
  .side{display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;width:var(--side);background:var(--navy);color:#fff;z-index:20}
  .side .logo{display:block;width:100%;height:auto;aspect-ratio:2/1;object-fit:cover;border-bottom:1px solid var(--navy-3)}
  .side nav{padding:12px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
  .side nav button{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 14px;border:0;background:none;color:#C9D3E0;border-radius:6px;font-size:15.5px;font-weight:500;text-align:left;border-left:4px solid transparent}
  .side nav button svg{width:22px;height:22px;flex:none}
  .side nav button:hover{background:var(--navy-2);color:#fff}
  .side nav button.on{background:var(--navy-2);color:var(--gold);border-left-color:var(--gold)}
  .side .who{padding:14px 18px 18px;border-top:1px solid var(--navy-3);font-size:14px}
  .side .who b{display:block;font-weight:600;color:#fff}
  .side .who small{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#9FB0C6}
  .side .who button{margin-top:10px;background:none;border:1px solid var(--navy-3);color:#C9D3E0;border-radius:6px;min-height:40px;padding:0 14px;font-size:14px}
  .main{margin-left:var(--side);padding-bottom:32px}
  .bottom{display:none}
}

/* ---------- cabeçalho ---------- */
.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:15}
.top-in{max-width:1180px;margin:0 auto;padding:14px 16px 0}
.top-row{display:flex;align-items:center;gap:12px;padding-bottom:12px}
.mark{width:36px;height:36px;border-radius:6px;background:var(--gold);flex:none;display:grid;place-items:center}
.mark svg{width:22px;height:22px;color:var(--navy)}
@media (min-width:900px){.mark{display:none}}
.obra{flex:1;min-width:0}
.obra h1{margin:0;font-size:18px;font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.obra p{margin:3px 0 0;font:600 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#A9B8CC}
.trocar{flex:none;min-height:44px;padding:0 14px;border-radius:6px;border:1px solid #3A587C;background:var(--navy-2);color:#fff;font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.trocar:hover{border-color:var(--gold)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;min-height:44px;padding:0 12px;color:#A9B8CC;font:600 12.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:#fff;border-bottom-color:var(--gold)}
.tabs-pad{height:4px}
.menu-obras{position:absolute;right:16px;top:62px;background:var(--card);color:var(--ink);border-radius:8px;box-shadow:0 12px 32px rgba(1,21,46,.25);width:min(360px,calc(100vw - 32px));overflow:hidden;z-index:40}
.menu-obras button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 16px;min-height:56px}
.menu-obras button:last-child{border-bottom:0}
.menu-obras button b{display:block;font-weight:600}
.menu-obras button small{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.menu-obras button.on{background:var(--soft);box-shadow:inset 4px 0 0 var(--gold)}

/* ---------- conteúdo ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:1100px){.grid2{grid-template-columns:1.25fr 1fr;align-items:start}}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.lbl{font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.link{background:none;border:0;min-height:44px;padding:0 4px;font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--navy);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--gold-d);text-decoration-thickness:2px}
.mono{font-family:var(--mono)}

/* faixa de alerta */
.alert{display:flex;align-items:center;gap:12px;background:var(--gold);color:var(--navy);border-radius:6px;padding:10px 10px 10px 14px}
.alert svg{width:24px;height:24px;flex:none}
.alert p{margin:0;flex:1;font-weight:600;font-size:16px;line-height:1.25}
.alert p small{display:block;font:600 11.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;opacity:.85;margin-top:2px}
.alert .btn{background:var(--navy);color:#fff;border-color:var(--navy)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:6px;padding:10px 12px 12px;min-width:0;text-align:left}
.kpi.bad{border-top-color:var(--bad)} .kpi.warn{border-top-color:var(--gold-d)} .kpi.ok{border-top-color:var(--ok)}
.kpi .lbl{font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .n{font-size:40px;font-weight:700;line-height:1.05;margin:4px 0 2px;letter-spacing:-.01em}
.kpi.bad .n{color:var(--bad)}
.kpi .s{font:600 11.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.kpi.bad .s{color:var(--bad)} .kpi.warn .s{color:var(--warn)}
.bars{display:flex;align-items:flex-end;gap:3px;height:18px;margin-top:6px}
.bars i{display:block;width:5px;background:var(--navy-3);border-radius:1px}
.bars i.last{background:var(--gold-d)}
button.kpi{font:inherit;cursor:pointer}
@media (min-width:900px){.kpi .n{font-size:46px}.kpi .lbl{font-size:12px}}

/* avanço */
.av{padding:14px}
.av-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.av-big{display:flex;align-items:baseline;gap:10px}
.av-big b{font-size:40px;font-weight:700;line-height:1}
.av-big span{font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.track{position:relative;height:14px;background:var(--idle-bg);border-radius:3px;margin:12px 0 8px;overflow:visible}
.track .fill{position:absolute;left:0;top:0;bottom:0;background:var(--navy);border-radius:3px}
.track .goal{position:absolute;top:-5px;bottom:-5px;width:4px;background:var(--gold-d);border-radius:2px}
.steps{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.steps .done{color:var(--ok)}

.av-hero b{font-size:52px}
.av-hero span{line-height:1.35}
@media (min-width:1100px){.top2{grid-template-columns:1fr 1.25fr}}

/* semana */
.wk-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px 4px}
.wk-top .av-big b{font-size:40px}
.wk-top .av-big span{line-height:1.35}
.week{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:10px 14px 12px}
.day{border:1px solid var(--line);border-radius:6px;padding:7px 2px 0;text-align:center;display:flex;flex-direction:column;align-items:center;overflow:hidden;min-height:76px}
.day small{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.day b{font-size:18px;font-weight:700;line-height:1.2;margin-top:2px}
.day em{font:500 10.5px var(--mono);font-style:normal;color:var(--muted)}
.day .seg{display:flex;width:100%;height:5px;margin-top:auto}
.day .seg i{display:block;height:100%}
.day .seg .f{background:var(--ok)} .day .seg .n{background:var(--bad)} .day .seg .p{background:var(--idle-line)}
.day.bad b{color:var(--bad)}
.day.ok b{color:var(--ok)}
.day.fut{background:var(--soft)}
.day.fut b{color:var(--muted)}
.day.hoje{border:2px solid var(--navy);box-shadow:inset 0 3px 0 var(--gold)}
.wk-sub{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line);background:var(--soft)}

/* tags */
.tag{display:inline-flex;align-items:center;gap:4px;font:600 11.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:4px;border:1px solid;white-space:nowrap}
.tag.ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-line)}
.tag.warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line)}
.tag.bad{color:#fff;background:var(--bad);border-color:var(--bad)}
.tag.idle{color:var(--idle);background:var(--idle-bg);border-color:var(--idle-line)}

/* listas */
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);min-height:60px}
.row:last-child{border-bottom:0}
.row.is-bad{background:var(--bad-bg);box-shadow:inset 4px 0 0 var(--bad)}
.row.is-warn{background:#FFF9EA;box-shadow:inset 4px 0 0 var(--gold-d)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;font-size:16px;line-height:1.25}
.row .t small{display:block;margin-top:3px;font:600 11.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.row.is-bad .t small{color:#9B2020}
.row .pct{text-align:right;flex:none}
.row .pct b{display:block;font-size:20px;font-weight:700;line-height:1.1}
.row .pct small{font:600 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
button.row{width:100%;background:var(--card);border:0;border-bottom:1px solid var(--line);text-align:left}
button.row:hover{background:var(--soft)}
.more{padding:10px 14px;font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);border-top:1px solid var(--line)}

/* mini cartões */
.minis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.mini b{display:block;font-size:22px;font-weight:700;margin-top:4px}
.mini .lbl{font-size:11px}

/* gráfico */
.chart{padding:8px 10px 12px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:0 14px 12px;font:600 11.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
.scroll-x{overflow-x:auto}
.scroll-x svg{min-width:700px}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:6px;border:1px solid var(--navy);background:var(--card);color:var(--navy);font-weight:600;font-size:15.5px;white-space:nowrap}
.btn svg{width:20px;height:20px}
.btn-primary{background:var(--gold);border-color:var(--gold-d);color:var(--navy)}
.btn-primary:hover{background:var(--gold-l)}
.btn-dark{background:var(--navy);color:#fff}
.btn-block{width:100%}

/* chips de filtro */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--card);font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .c{display:inline-block;margin-left:6px;padding:2px 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px}

.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.toolbar .info{font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}

/* cronograma */
.grp{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:10px 14px;background:var(--soft);border:0;border-bottom:1px solid var(--line);text-align:left}
.grp svg{width:20px;height:20px;transition:transform .15s;flex:none}
.grp.closed svg{transform:rotate(-90deg)}
.grp b{flex:1;font-weight:700;font-size:15.5px}
.grp .mono{font-size:12px;color:var(--ink-2);font-weight:600}
.leaf .bar{height:6px;background:var(--idle-bg);border-radius:3px;position:relative;margin-top:8px}
.leaf .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--navy)}
.leaf .bar u{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--gold-d);border-radius:2px}
.leaf.is-bad .bar i{background:var(--bad)}

/* efetivo */
.datenav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datenav button{width:48px;height:48px;border-radius:6px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.datenav button:disabled{opacity:.35;cursor:default}
.datenav button svg{width:22px;height:22px}
.datenav .d{text-align:center}
.datenav .d b{display:block;font-size:20px;font-weight:700}
.datenav .d small{font:600 11.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tot{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:0}
.tot > div{padding:12px;border-right:1px solid var(--line)}
.tot > div:last-child{border-right:0}
.tot b{display:block;font-size:28px;font-weight:700;line-height:1.1;margin-top:4px}
.tot .big b{font-size:44px}
.tot .lbl{font-size:10.5px}
@media (max-width:480px){.tot{grid-template-columns:1fr 1fr 1fr}.tot .big{grid-column:1/-1;border-right:0;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:12px}}
.stepper{display:flex;align-items:center;gap:0;flex:none;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.stepper button{width:46px;height:48px;border:0;background:var(--soft);font-size:22px;font-weight:600;color:var(--navy)}
.stepper button:active{background:var(--line)}
.stepper output{width:46px;text-align:center;font-size:20px;font-weight:700}
.savebar{position:sticky;bottom:calc(var(--bottom) + 8px + env(safe-area-inset-bottom));z-index:5}
@media (min-width:900px){.savebar{bottom:12px}}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--soft)}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
table.t tr:last-child td{border-bottom:0}
table.t td b{font-weight:700}

/* estado vazio */
.empty{text-align:center;padding:40px 20px 44px}
.empty .ic{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;background:var(--warn-bg);display:grid;place-items:center;border:2px solid var(--gold)}
.empty .ic svg{width:40px;height:40px;color:var(--navy)}
.empty h2{margin:0 0 8px;font-size:21px;font-weight:700}
.empty p{margin:0 auto 22px;max-width:440px;color:var(--ink-2);font-size:16px}
.empty .how{margin:22px auto 0;max-width:440px;text-align:left;background:var(--soft);border-radius:6px;padding:12px 14px;font-size:14.5px;color:var(--ink-2)}
.empty .how b{color:var(--ink)}

/* gaveta */
.scrim{position:fixed;inset:0;background:rgba(1,21,46,.45);z-index:50;display:none}
.scrim.open{display:block}
.drawer{position:fixed;z-index:60;background:var(--card);left:0;right:0;bottom:0;max-height:90vh;border-radius:12px 12px 0 0;transform:translateY(105%);transition:transform .22s ease;display:flex;flex-direction:column}
.drawer.open{transform:none}
@media (min-width:900px){.drawer{left:auto;top:0;bottom:0;width:440px;max-height:none;border-radius:0;transform:translateX(105%)}}
.dr-h{background:var(--navy);color:#fff;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;border-radius:12px 12px 0 0}
@media (min-width:900px){.dr-h{border-radius:0}}
.dr-h div{flex:1}
.dr-h small{font:600 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#A9B8CC}
.dr-h h2{margin:4px 0 0;font-size:20px}
.dr-h button{width:44px;height:44px;border-radius:6px;border:1px solid #3A587C;background:var(--navy-2);color:#fff;display:grid;place-items:center}
.dr-b{overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{min-height:52px;border-radius:6px;border:1px solid var(--line);background:var(--soft);font-size:18px;font-weight:700}
.quick button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.field label{display:block;margin-bottom:6px}
.field input,.field textarea{width:100%;min-height:52px;border:1px solid var(--line);border-radius:6px;padding:12px 14px;font-size:18px;background:#fff;color:var(--ink)}
.field textarea{font-size:16px;min-height:80px;resize:vertical}
.field input:focus,.field textarea:focus{outline:3px solid var(--gold);outline-offset:1px;border-color:var(--navy)}
.hist li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.hist li:last-child{border-bottom:0}
.hist .ph{width:52px;height:52px;border-radius:4px;flex:none;background:repeating-linear-gradient(135deg,#C9B48A 0 6px,#B89D6A 6px 12px);display:grid;place-items:center;color:#fff;font:600 10px var(--mono)}
.hist b{font-size:18px}

/* aviso flutuante */
.toast{position:fixed;left:50%;bottom:calc(var(--bottom) + 20px);transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:14px 18px;border-radius:8px;font-weight:600;opacity:0;transition:.2s;z-index:70;display:flex;align-items:center;gap:10px;box-shadow:0 10px 24px rgba(1,21,46,.3);max-width:calc(100vw - 32px)}
.toast svg{width:20px;height:20px;color:var(--gold)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:900px){.toast{bottom:28px;left:calc(50% + var(--side)/2)}}

.ph-card{padding:28px 20px;text-align:center;color:var(--ink-2)}
.ph-card h2{color:var(--ink);margin:0 0 6px;font-size:19px}
.hide-m{display:none}
@media (min-width:900px){.hide-m{display:inline}}
</style>

}

function lob(){
  const locs = ['Quadra A','Quadra B','Quadra C','Quadra D'];
  const W=860,H=340,ml=92,mr=16,mt=28,mb=40,w=W-ml-mr,h=H-mt-mb;
  const t0=new Date(2026,7,1), t1=new Date(2027,0,20);
  const x = dt => ml + (dt-t0)/(t1-t0)*w;
  const band = h/locs.length;
  const yB = i => mt + h - i*band, yT = i => mt + h - (i+1)*band;
  const pd = s => s.length>5 ? D(s) : D(s+'/2026');
  let out = '';
  // faixas
  locs.forEach((l,i)=>{
    out += `<rect x="${ml}" y="${yT(i)}" width="${w}" height="${band}" fill="${i%2?'#F6F8FA':'#fff'}"/>`;
    out += `<text x="${ml-10}" y="${yT(i)+band/2+5}" text-anchor="end" font-family="IBM Plex Sans,sans-serif" font-size="14" font-weight="600" fill="#0E1A2B">${l}</text>`;
  });
  // meses
  [['AGO',new Date(2026,7,1)],['SET',new Date(2026,8,1)],['OUT',new Date(2026,9,1)],['NOV',new Date(2026,10,1)],['DEZ',new Date(2026,11,1)],['JAN',new Date(2027,0,1)]].forEach(([t,dt])=>{
    out += `<line x1="${x(dt)}" x2="${x(dt)}" y1="${mt}" y2="${mt+h}" stroke="#E3E8EE"/><text x="${x(dt)+4}" y="${H-14}" font-family="IBM Plex Mono,monospace" font-size="11.5" font-weight="600" fill="#5B6576">${t}</text>`;
  });
  // linhas por serviço
  SERV.forEach(sv=>{
    const cor = SERV_COR[sv];
    const its = locs.map((l,i)=>({i,a:ATIV.find(a=>a.local===l&&a.serv===sv)})).filter(o=>o.a);
    const prev = its.map(({i,a})=>`${x(pd(a.bi)).toFixed(1)},${yB(i).toFixed(1)} ${x(pd(a.bf)).toFixed(1)},${yT(i).toFixed(1)}`).join(' ');
    out += `<polyline points="${prev}" fill="none" stroke="${cor}" stroke-width="2.2" stroke-dasharray="6 5"/>`;
    its.forEach(({i,a})=>{
      if(!a.ri) return;
      const fim = a.rf ? pd(a.rf) : HOJE;
      const frac = a.rf ? 1 : a.real/100;
      const yEnd = yB(i) - frac*band;
      const late = situacao(a).c==='bad';
      out += `<line x1="${x(pd(a.ri))}" y1="${yB(i)}" x2="${x(fim)}" y2="${yEnd}" stroke="${late?'#C62828':cor}" stroke-width="5" stroke-linecap="round"/>`;
    });
  });
  // colisão: Rede de água B termina 16/10, Meio-fio B começa 12/10
  const cx = x(D('14/10/2026')), cy = yT(1)+band*0.45;
  out += `<g><circle cx="${cx}" cy="${cy}" r="12" fill="#F5B03B" stroke="#01152E" stroke-width="2"/><text x="${cx}" y="${cy+5}" text-anchor="middle" font-family="IBM Plex Sans" font-size="15" font-weight="700" fill="#01152E">!</text></g>`;
  // hoje
  out += `<line x1="${x(HOJE)}" x2="${x(HOJE)}" y1="${mt-6}" y2="${mt+h}" stroke="#01152E" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="${x(HOJE)-24}" y="${mt-22}" width="48" height="18" rx="3" fill="#01152E"/><text x="${x(HOJE)}" y="${mt-9}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="10.5" font-weight="600" fill="#fff">HOJE</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Linha de balanço por quadra e serviço">${out}</svg>`;
}

  }
  if (S.tabCrono==='avanco') {
    const lista = ATIV.filter(a => a.real<100 && (a.real>0 || a.prev>0));
    return `<div class="wrap stack">
      <div class="toolbar"><span class="info">${lista.length} atividades em andamento ou previstas esta semana</span></div>
      <div class="card"><ul class="list">${lista.map(a=>{const s=situacao(a);return `
        <li><button type="button" class="row leaf ${s.c==='bad'?'is-bad':''}" data-ativ="${a.id}">
          <span class="t"><b>${a.local} › ${a.serv}</b><small>Previsto hoje ${a.prev}% · base ${a.bi}–${a.bf}</small>
            <span class="bar" style="display:block"><i style="width:${a.real}%"></i><u style="left:calc(${a.prev}% - 1px)"></u></span></span>
          <span class="pct"><b>${a.real}%</b><small>lançar ›</small></span>
        </button></li>`;}).join('')}</ul></div>
    </div>`;
  }
  const filtros = [['todas','Todas'],['atrasadas','Atrasadas'],['semana','Desta semana'],['mes','Do mês']];
  const nAtr = ATIV.filter(a=>situacao(a).c==='bad').length;
  const passa = a => S.filtro==='todas' ? true
    : S.filtro==='atrasadas' ? situacao(a).c==='bad'
    : S.filtro==='semana' ? (a.real<100 && (a.prev>0 && a.prev<100 || a.real>0)) || a.bi==='12/10'
    : pdM(a.bi)<=10 && pdM(a.bf)>=10;
  const locs = [...new Set(ATIV.map(a=>a.local))];
  return `<div class="wrap stack">
    <div class="toolbar">
      <span class="info">Revisão ${o.rev} · importado em ${o.imp} · ${ATIV.length} atividades</span>
      <button type="button" class="btn" data-act="toast" data-msg="Abre a importação do XML do MS Project">${I.upload} Importar cronograma</button>
    </div>
    <div class="chips">${filtros.map(([k,t])=>`<button type="button" class="chip ${S.filtro===k?'on':''}" data-filtro-set="${k}">${t}${k==='atrasadas'?`<span class="c">${nAtr}</span>`:''}</button>`).join('')}</div>
    <div class="card" style="overflow:hidden">
      ${locs.map((l,li)=>{
        const its = ATIV.filter(a=>a.local===l && passa(a));
        if(!its.length) return '';
        const todas = ATIV.filter(a=>a.local===l);
        const pct = Math.round(todas.reduce((s,a)=>s+a.real,0)/todas.length);
        const fechado = S.fechados[l];
        return `<button type="button" class="grp ${fechado?'closed':''}" data-grp="${l}">${I.chev}<b>${li+1} · ${l}</b><span class="mono">${pct}% realizado</span></button>
          ${fechado?'':`<ul class="list">${its.map(a=>{const s=situacao(a);return `
            <li><button type="button" class="row leaf ${s.c==='bad'?'is-bad':''}" data-ativ="${a.id}">
              <span class="t"><b>${a.serv}</b><small>EAP ${a.eap} · base ${a.bi}–${a.bf}${a.ri?' · real '+a.ri+'–'+(a.rf||''):''}</small>
                <span class="bar" style="display:block"><i style="width:${a.real}%"></i><u style="left:calc(${a.prev}% - 1px)"></u></span></span>
              <span class="pct"><b>${a.real}%</b><span class="tag ${s.c}" style="margin-top:4px">${s.t}</span></span>
            </button></li>`;}).join('')}</ul>`}`;
      }).join('')}
    </div>
    <p class="mono" style="margin:0;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em">BARRA: AZUL = REALIZADO · TRAÇO DOURADO = PREVISTO HOJE</p>
  </div>`;
}
const pdM = s => Number(s.split('/')[1]);

function telaEfetivo(){
  const o = obraAtual();
  if (!o.rev) return telaVaziaObra();
  const isHoje = S.efDia===0;
  const linhas = isHoje ? S.efHoje : EFETIVO_ONTEM;
  const titulo = isHoje ? 'Sexta, 09/10' : 'Quinta, 08/10';
  const nav = `<div class="datenav card" style="padding:6px">
      <button type="button" data-act="ef-prev" ${isHoje?'':'disabled'} aria-label="Dia anterior">${I.left}</button>
      <div class="d"><b>${titulo}</b><small>${isHoje?'Hoje':'Ontem · somente o gerente edita'}</small></div>
      <button type="button" data-act="ef-next" ${isHoje?'disabled':''} aria-label="Próximo dia">${I.right}</button>
    </div>`;
  const tabela = `<div class="card" style="overflow:hidden">
      <div class="card-h"><span class="lbl">Últimos dias</span><button type="button" class="link" data-act="toast" data-msg="Mostra os últimos 30 dias">Ver 30 dias</button></div>
      <table class="t"><thead><tr><th>Dia</th><th>MO dir.</th><th>MO ind.</th><th>Terc.</th><th>Total</th></tr></thead>
      <tbody>${EF_DIAS.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td><b>${r[1]+r[2]+r[3]}</b></td></tr>`).join('')}</tbody></table>
    </div>`;
  if (!linhas) {
    return `<div class="wrap stack">${nav}
      <div class="card empty" style="padding:32px 20px">
        <div class="ic">${I.efetivo}</div>
        <h2>Efetivo de hoje ainda não lançado</h2>
        <p>Ontem foram <b>23 pessoas</b>. Copie e ajuste só o que mudou: leva menos de um minuto.</p>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          <button type="button" class="btn btn-primary" data-act="ef-copiar">${I.copy} Copiar de ontem</button>
          <button type="button" class="btn" data-act="toast" data-msg="Abre o formulário de nova linha">${I.plus} Adicionar linha</button>
        </div>
      </div>
      ${tabela}</div>`;
  }
  const soma = t => linhas.filter(l=>l.tipo===t).reduce((s,l)=>s+l.q,0);
  const total = linhas.reduce((s,l)=>s+l.q,0);
  const grupo = t => {
    const ls = linhas.map((l,i)=>({...l,i})).filter(l=>l.tipo===t);
    return `<div class="card">
      <div class="card-h"><span class="lbl">${t}</span><span class="mono" style="font-weight:600;font-size:13px">${soma(t)} pessoas</span></div>
      <ul class="list">${ls.map(l=>`<li class="row">
        <span class="t"><b>${l.f}</b><small>${[l.e,l.a].filter(Boolean).join(' · ') || 'Obra toda'}</small></span>
        ${isHoje ? `<span class="stepper"><button type="button" data-q="${l.i}" data-d="-1" aria-label="Menos">−</button><output>${l.q}</output><button type="button" data-q="${l.i}" data-d="1" aria-label="Mais">+</button></span>`
                 : `<span class="pct"><b>${l.q}</b></span>`}
      </li>`).join('')}</ul>
    </div>`;
  };
  return `<div class="wrap stack">${nav}
    <div class="card tot">
      <div class="big"><span class="lbl">Total no canteiro</span><b>${total}</b></div>
      <div><span class="lbl">MO direta</span><b>${soma('MO direta')}</b></div>
      <div><span class="lbl">MO indireta</span><b>${soma('MO indireta')}</b></div>
      <div><span class="lbl">Terceiriz.</span><b>${soma('Terceirizado')}</b></div>
    </div>
    ${grupo('MO direta')}${grupo('MO indireta')}${grupo('Terceirizado')}
    ${isHoje ? `<button type="button" class="btn" data-act="toast" data-msg="Abre o formulário de nova linha">${I.plus} Adicionar linha</button>
      <div class="savebar"><button type="button" class="btn btn-primary btn-block" data-act="ef-salvar">${I.check} Salvar efetivo de 09/10</button></div>` : ''}
    ${tabela}
  </div>`;
}

function telaPlaceholder(nome){
  return `<div class="wrap"><div class="card ph-card">
    <h2>${nome}</h2>
    <p>Esta tela não faz parte deste preview. Ela segue o mesmo estilo e entra na construção.</p>
    <button type="button" class="btn" data-go="painel">Voltar ao Painel</button>
  </div></div>`;
}
function telaMais(){
  return `<div class="wrap"><div class="card"><ul class="list">
    ${[['obras','Obras',I.obras],['usuarios','Usuários',I.users]].map(([k,t,ic])=>`<li><button type="button" class="row" data-go="${k}"><span style="width:24px;height:24px;display:block">${ic}</span><span class="t"><b>${t}</b></span>${I.right.replace('<svg','<svg width="20" height="20"')}</button></li>`).join('')}
    <li><button type="button" class="row" data-act="toast" data-msg="Abre a lista de avisos"><span class="t"><b>Avisos</b></span></button></li>
    <li><button type="button" class="row" data-act="toast" data-msg="Abre Meu perfil"><span class="t"><b>Meu perfil</b><small>Carlos Andrade · Gerente</small></span></button></li>
    <li><button type="button" class="row"><span class="t"><b style="color:var(--bad)">Sair</b></span></button></li>
  </ul></div></div>`;
}

/* ===================== GAVETA (avanço) ===================== */
function abrirAtiv(id){
  const a = ATIV[id]; S.sel = id; S.pctSel = null;
  const s = situacao(a);
  const h = HIST[id] || [];
  document.getElementById('drawer').innerHTML = `
    <div class="dr-h"><div><small>EAP ${a.eap} · ${a.local}</small><h2>${a.serv}</h2></div><button type="button" data-act="fechar" aria-label="Fechar">${I.close}</button></div>
    <div class="dr-b">
      <div class="kpis" style="grid-template-columns:repeat(3,1fr)">
        <div class="kpi"><span class="lbl">Previsto</span><div class="n" style="font-size:34px">${a.prev}%</div></div>
        <div class="kpi ${s.c==='bad'?'bad':'ok'}"><span class="lbl">Realizado</span><div class="n" style="font-size:34px">${a.real}%</div></div>
        <div class="kpi"><span class="lbl">Situação</span><div style="margin-top:12px"><span class="tag ${s.c}">${s.t}</span></div></div>
      </div>
      <div class="mono" style="font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.04em">BASE ${a.bi} – ${a.bf}${a.ri?' · REAL '+a.ri+' – '+(a.rf||'em andamento'):''}</div>
      ${a.real<100 ? `
      <div class="card" style="padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--soft)">
        <span class="lbl">Lançar avanço · hoje, 09/10</span>
        <div class="quick">${[25,50,75,100].map(v=>`<button type="button" data-pct="${v}" ${v<=a.real?'disabled style="opacity:.35"':''}>${v}%</button>`).join('')}</div>
        <div class="field"><label class="lbl" for="pct">Novo % realizado</label><input id="pct" type="number" inputmode="numeric" min="0" max="100" placeholder="Ex.: ${Math.min(a.real+10,100)}"></div>
        <div class="field"><label class="lbl" for="obs">Observação (opcional)</label><textarea id="obs" placeholder="Ex.: trecho 3 concluído, falta caixa de inspeção"></textarea></div>
        <button type="button" class="btn">${I.camera} Tirar foto</button>
        <button type="button" class="btn btn-primary btn-block" data-act="salvar-av">${I.check} Salvar avanço</button>
      </div>` : `<div class="row" style="background:var(--ok-bg);border-radius:6px"><span class="t"><b>Atividade concluída</b><small>Terminou em ${a.rf}</small></span><span class="tag ok">100%</span></div>`}
      <div>
        <span class="lbl">Histórico de avanço</span>
        <ul class="list hist" style="margin-top:6px">${h.length ? h.map(([d,p,q,o,f])=>`<li>${f?'<span class="ph">FOTO</span>':''}<div style="flex:1"><b>${p}%</b> <span class="mono" style="font-size:12px;font-weight:600;color:var(--muted)">${d} · ${q.toUpperCase()}</span>${o?`<div style="color:var(--ink-2);font-size:15px;margin-top:2px">${o}</div>`:''}</div></li>`).join('')
          : '<li><span style="color:var(--ink-2)">Nenhum avanço lançado ainda.</span></li>'}</ul>
      </div>
      ${a.local==='Quadra A'&&a.serv==='Pavimentação'?`<div><span class="lbl">Restrições</span><ul class="list" style="margin-top:6px"><li class="row is-bad" style="border-radius:6px"><span class="t"><b>Usina sem data de entrega de CBUQ</b><small>Material · venceu 03/10</small></span></li></ul></div>`:''}
    </div>`;
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawer').setAttribute('aria-hidden','false');
  document.getElementById('scrim').classList.add('open');
}
function fechar(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawer').setAttribute('aria-hidden','true');
  document.getElementById('scrim').classList.remove('open');
}

/* ===================== RENDER ===================== */
function render(){
  renderNav(); renderTop();
  const v = {painel:telaPainel, crono:telaCrono, efetivo:telaEfetivo, mais:telaMais,
    plan:()=>telaPlaceholder('Planejamento (3 meses, restrições, semana e dia)'),
    obras:()=>telaPlaceholder('Obras'), usuarios:()=>telaPlaceholder('Usuários')}[S.tela];
  document.getElementById('view').innerHTML = v();
}
let tt;
function toast(msg){
  const t = document.getElementById('toast');
  t.innerHTML = I.check + '<span>'+msg+'</span>';
  t.classList.add('show'); clearTimeout(tt); tt = setTimeout(()=>t.classList.remove('show'), 2200);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-go],[data-act],[data-tab],[data-obra],[data-filtro-set],[data-grp],[data-ativ],[data-q],[data-pct]');
  if (!el) { if (S.menuObras && !e.target.closest('.menu-obras')) { S.menuObras=false; renderTop(); } return; }
  const d = el.dataset;
  if (d.go){ S.tela=d.go; S.menuObras=false; if(d.filtro){S.filtro=d.filtro; S.tabCrono='lista';} fechar(); render(); window.scrollTo(0,0); return; }
  if (d.tab){ S.tabCrono=d.tab; render(); return; }
  if (d.obra){ S.obra=Number(d.obra); S.menuObras=false; render(); toast('Obra trocada'); return; }
  if (d.filtroSet){ S.filtro=d.filtroSet; render(); return; }
  if (d.grp){ S.fechados[d.grp]=!S.fechados[d.grp]; render(); return; }
  if (d.ativ!==undefined){ abrirAtiv(Number(d.ativ)); return; }
  if (d.q!==undefined){ const l=S.efHoje[Number(d.q)]; l.q=Math.max(0,l.q+Number(d.d)); render(); return; }
  if (d.pct){ document.getElementById('pct').value=d.pct; document.querySelectorAll('.quick button').forEach(b=>b.classList.toggle('on',b===el)); return; }
  switch(d.act){
    case 'obras-menu': S.menuObras=!S.menuObras; renderTop(); break;
    case 'toast': toast(d.msg); break;
    case 'fechar': fechar(); break;
    case 'ef-copiar': S.efHoje = EFETIVO_ONTEM.map(l=>({...l})); render(); toast('Copiado de ontem: 23 pessoas'); break;
    case 'ef-prev': S.efDia=1; render(); break;
    case 'ef-next': S.efDia=0; render(); break;
    case 'ef-salvar': toast('Efetivo de 09/10 salvo'); S.tela='painel'; render(); window.scrollTo(0,0); break;
    case 'salvar-av': {
      const v = Number(document.getElementById('pct').value);
      const a = ATIV[S.sel];
      if (!v && v!==0 || v<0 || v>100){ toast('Informe um % entre 0 e 100'); return; }
      if (v < a.real && !confirm(`O novo % é menor que o anterior (${a.real}%). Confirmar?`)) return;
      a.real = v; (HIST[S.sel] = HIST[S.sel]||[]).unshift(['09/10',v,'Carlos Andrade',document.getElementById('obs').value,false]);
      fechar(); render(); toast(`Avanço salvo: ${a.local} › ${a.serv} em ${v}%`); break;
    }
  }
});
document.getElementById('scrim').addEventListener('click', fechar);
document.addEventListener('keydown', e => { if(e.key==='Escape') fechar(); });
render();
</script>
</body>
</html>
